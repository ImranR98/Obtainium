name: obtainium
description: Get Android app updates straight from the source.
publish_to: 'none'

version: 1.7.1+2359

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  path_provider: ^2.1.6
  flutter_fgbg: ^0.8.0
  flutter_local_notifications: ^22.3.2
  provider: ^6.1.5+1
  http: ^1.6.0
  webview_flutter: ^4.14.1
  dynamic_color: ^2.1.0
  material_ui: ^1.7.0
  material_color_utilities: ^0.13.0
  html: ^0.15.7
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  permission_handler: ^13.0.2
  fluttertoast: 10.0.0 # TODO: 10.0.1+ applies KGP unconditionally, breaking AGP 9 built-in Kotlin
  device_info_plus: ^13.3.0
  file_picker: ^13.1.0
  animations: ^3.0.0
  android_package_installer: # TODO: Upstream PR pending; if not accepted, keep fork maintained
    git:
      url: https://github.com/ImranR98/android_package_installer
      ref: 94525707bd1fba8cba4d19b4cb2b928580913510
  android_package_manager: # TODO: Submit PR to upstream and switch back when merged
    git:
      url: https://github.com/ImranR98/android_package_manager
      ref: b5bc0365bd7faab6f51f6ec8baf4a9dab0df9117
  share_plus: ^13.3.1
  sqflite: ^2.4.4+2
  easy_localization: ^3.0.8
  intl: ^0.20.3
  android_intent_plus: ^6.1.0
  flutter_archive: ^6.3.1
  archive: ^4.5.2
  hsluv: ^1.1.3
  connectivity_plus: ^7.3.1
  shared_storage: # TODO: Upstream maintenance uncertain; consider alternatives or fork to org
    git:
      url: https://github.com/AlexBacich/shared-storage
      ref: 6dbcdf2c2045e326f59c062f542724aedf73cb6e
  crypto: ^3.0.7
  xml: ^7.0.1
  bcrypt: ^1.2.0
  app_links: ^7.2.2
  equations: ^6.0.0
  flex_color_picker: ^4.0.0
  android_system_font: # TODO: Forked dependency; watch upstream for releases
    git:
      url: https://github.com/ImranR98/android_system_font
      ref: 7efa523a0cb40fb243318450c60dfd0e882e6b0c
  shizuku_apk_installer: # TODO: Forked dependency; watch upstream for releases
    git:
      url: https://github.com/ImranR98/shizuku_apk_installer
      ref: 9777a8bc78dd19300b4647e34e9d52bca772d8e1
  markdown: ^7.3.1
  flutter_typeahead: ^6.0.0
  battery_plus: ^7.1.2
  flutter_charset_detector: ^6.0.0
  flutter_markdown_plus: ^1.0.12
  workmanager: ^0.10.10
  logger: ^2.8.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/graphics/icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/graphics/
    - assets/ca-certs/

  fonts:
      - family: Montserrat
        fonts:
          - asset: assets/fonts/Montserrat-Regular.ttf
