name: obtainium
description: Get Android app updates straight from the source.
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# ObtainX uses its own version line, independent of upstream Obtainium's.
version: 2.9.7+3970

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  path_provider: ^2.1.6
  flutter_fgbg: ^0.8.0
  flutter_local_notifications: ^22.0.1
  flutter_svg: ^2.3.0
  provider: ^6.1.5+1
  http: ^1.6.0
  webview_flutter: ^4.14.1
  # Upstream Material `dynamic_color` package. We use only `DynamicColorBuilder`
  # and the `.harmonized()` ColorScheme extension - both available in the
  # upstream package - so the previous `dynamic_system_colors` fork (which
  # added APIs we don't use) was swapped out for the upstream to unblock the
  # bruckcode M3E packages, which transitively depend on `dynamic_color` and
  # would otherwise collide with the fork's identical Android plugin class.
  # NOTE: upstream Obtainium uses `dynamic_system_colors` here — intentional divergence, do not "fix".
  dynamic_color: ^1.8.1
  html: ^0.15.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  permission_handler: ^12.0.3
  fluttertoast: ^9.1.0
  device_info_plus: ^13.2.0
  file_picker: ^12.0.0-beta.7
  animations: ^2.2.0
  android_package_installer: # TODO: Upstream PR pending; if not accepted, keep fork maintained
    git:
      url: https://github.com/ImranR98/android_package_installer
      ref: c0a7e4759b20a0c2cd1b4d40a41ff395e5f3d0e4
  android_package_manager: # TODO: Submit PR to upstream and switch back when merged
    git:
      url: https://github.com/ImranR98/android_package_manager
      ref: 98661a5824c94ae990ae0f7bf0bdb1478300c4f7
  share_plus: ^13.2.0
  sqflite: ^2.4.3
  easy_localization: ^3.0.8
  intl: ^0.20.2
  android_intent_plus: ^6.0.0
  flutter_archive: ^6.3.1
  archive: ^4.0.9
  hsluv: ^1.1.3
  connectivity_plus: ^7.2.0
  shared_storage: # TODO: Upstream maintenance uncertain; consider alternatives or fork to org
    git:
      url: https://github.com/AlexBacich/shared-storage
      ref: 6dbcdf2c2045e326f59c062f542724aedf73cb6e
  crypto: ^3.0.7
  bcrypt: ^1.2.0
  app_links: ^7.2.1
  equations: ^6.0.0
  shizuku_apk_installer: # TODO: Forked dependency; watch upstream for releases
    git:
      url: https://github.com/re7gog/shizuku_apk_installer
      ref: 3ef7f8fbf904848d144304556b0f80c91fee82a5
  markdown: ^7.3.1
  flutter_typeahead: ^6.0.0
  battery_plus: ^7.1.0
  flutter_charset_detector: ^6.0.0
  flutter_markdown_plus: ^1.0.12
  workmanager: ^0.9.0+3
  flutter_foreground_task: ^10.0.0
  # Material 3 Expressive pull-to-refresh: drop-in replacement for the legacy
  # circular spinner inside RefreshIndicator with the M3E morphing-polygon
  # loading shape. MIT-licensed, mirrors RefreshIndicator's API exactly.
  expressive_refresh: ^0.1.2
  # Material 3 Expressive standalone loading indicator (the same morphing
  # polygon shape as inside ExpressiveRefreshIndicator). MIT, depends only
  # on flutter + material_new_shapes (already pulled by expressive_refresh)
  # so adds no new transitive deps and no dynamic_color collision risk.
  # Used to replace the hand-rolled BulkM3LoadingIndicator and stock
  # CircularProgressIndicator instances for visual consistency with the
  # pull-to-refresh.
  expressive_loading_indicator: ^0.0.1
  # Material 3 Expressive linear/circular progress indicators - the wavy
  # active-track variant. Replaces stock LinearProgressIndicator at the
  # main user-facing surfaces (refresh progress, install button overlay,
  # bulk-add per-store scan, import/export). Verified publisher
  # bruckcode.de, MIT, also via m3e_design.
  progress_indicator_m3e: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # FFI-backed sqflite so unit tests can construct AppsProvider (LogsProvider
  # opens a DB on construction).
  sqflite_common_ffi: any
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/graphics/icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/graphics/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  #
  # No bundled font: the app uses the device's OS system font (see
  # NativeFeatures.loadSystemFont / fontFamily handling in main.dart).
